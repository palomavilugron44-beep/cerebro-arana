name: Cerebro y Arana

on:
  schedule:
    - cron: "7 * * * *"      # cada hora, al minuto 7 (hora UTC)
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araña + Cerebro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO || 'claude-haiku-5-5' }}
        run: python main.py

      - name: Publicar la decisión
        run: |
          git config user.name "cerebro-bot"
          git config user.email "cerebro-bot@users.noreply.github.com"
          git add publico/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Decisión del cerebro $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
